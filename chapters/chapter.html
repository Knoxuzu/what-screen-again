<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0812">
    <meta name="description" id="pageDescription" content="What Screen Again? — an interactive visual novel.">

    <title>What Screen Again?</title>
    <link rel="icon" href="../art/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="../css/chapter.css">
    <link rel="stylesheet" href="../css/scene-art.css">
    <link rel="stylesheet" href="../css/brand.css">

    <script src="../js/acts.js" defer></script>
    <script src="../js/chapter-meta.js" defer></script>
    <script src="../js/progress.js" defer></script>
    <!-- chapter-page.js fills this page for ?act=N, then loads the dialogue and story engine in order. -->
    <script src="../js/chapter-page.js" defer></script>
</head>

<body class="chapter-page" data-chapter="1">
    <noscript><p style="padding:2rem;color:#f1edf5">This story needs JavaScript turned on.</p></noscript>
    <main class="game">
        <section class="chapter-intro" id="chapterIntro">
            <a class="wsa-logo intro-logo" href="../index.html" aria-label="What Screen Again? — title screen">
                <span class="wsa-logo-mark" aria-hidden="true">W/</span>
                <span class="wsa-logo-text">WHAT SCREEN <b>AGAIN?</b></span>
            </a>
            <div class="intro-hud" aria-hidden="true">
                <span class="hud-corner hud-tl"></span>
                <span class="hud-corner hud-tr"></span>
                <span class="hud-corner hud-bl"></span>
                <span class="hud-corner hud-br"></span>

                <span class="hud-label hud-label-tl"><i></i>REC</span>
                <span class="hud-label hud-label-tr" data-meta="time"></span>
                <span class="hud-label hud-label-bl" data-meta="place"></span>
                <span class="hud-label hud-label-br" data-meta="frame"></span>
            </div>

            <div class="intro-stage">
                <div class="intro-notice intro-notice-a" aria-hidden="true"><span data-notice-symbol="0"></span><bdi data-notice-text="0"></bdi></div>
                <div class="intro-notice intro-notice-b" aria-hidden="true"><span data-notice-symbol="1"></span><bdi data-notice-text="1"></bdi></div>
                <div class="intro-notice intro-notice-c" aria-hidden="true"><span data-notice-symbol="2"></span><bdi data-notice-text="2"></bdi></div>

                <div class="intro-window">
                    <div class="window-bar" aria-hidden="true">
                        <span class="window-dots"><i></i><i></i><i></i></span>
                        <span class="window-title" data-meta="fragment"></span>
                        <span class="window-status"><i></i>READY</span>
                    </div>

                    <div class="window-body">
                        <p class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span><bdi data-meta="actLabel"></bdi><span class="eyebrow-line" aria-hidden="true"></span></p>

                        <h1><bdi data-meta="titleHead"></bdi> <span class="title-glass" data-meta="titleGlass"></span><bdi data-meta="titleTail"></bdi></h1>

                        <div class="intro-rule" aria-hidden="true">
                            <span></span>
                            <span class="intro-rule-mark">✳</span>
                            <span></span>
                        </div>

                        <div class="intro-description">
                            <p class="intro-line-accent" data-meta="tagline"></p>
                        </div>

                        <button class="primary-button" id="beginChapter" type="button"> <bdi id="beginLabel">BEGIN CHAPTER</bdi> <span
                                aria-hidden="true">→</span></button>

                    </div>
                </div>
            </div>
        </section>

        <section class="visual-novel hidden" id="visualNovel" aria-label="Visual novel gameplay">
            <span class="progress-track" role="progressbar" aria-label="Chapter progress" aria-valuemin="0"
                aria-valuemax="100" aria-valuenow="0" id="dialogueProgress">
                <span class="progress-fill" id="progressFill"></span>
            </span>

            <div class="scene-heading">
                <span id="sceneName"></span>
                <span id="sceneTime"></span>
            </div>

            <div class="art-stage" id="artStage">
                <div class="art-placeholder" id="artPlaceholder" hidden></div>

                <div class="stage-overlay" aria-hidden="true"></div>

                <p class="stage-caption" id="stageCaption"></p>
            </div>

            <div class="choices hidden" id="choices" aria-label="Choose your response"></div>

            <section class="dialogue-panel" id="dialoguePanel" data-state="ready">
                <div class="speaker-nameplate" id="speakerNameplate">
                    <span class="speaker-indicator" aria-hidden="true"></span>
                    <span class="speaker" id="speaker">NARRATION</span>
                </div>

                <p class="dialogue-text" id="dialogueText" aria-hidden="true"></p>
                <p class="sr-only" id="dialogueAnnounce" aria-live="polite"></p>

                <span class="click-hint" id="clickHint" aria-hidden="true">▼</span>

                <div class="quick-menu" id="dialogueNavigation" aria-label="Quick menu">
                    <button class="quick-button" id="previousLine" type="button"
                        title="Previous line (Left arrow)">BACK</button>
                    <button class="quick-button" id="autoToggle" type="button" aria-pressed="false"
                        title="Advance automatically">AUTO</button>
                    <a class="quick-button" href="../chapters.html"
                        title="Back to the fragment archive. Your place is saved.">ARCHIVE</a>

                    <span class="quick-menu-spacer"></span>

                    <span class="keyboard-hint">SPACE · ENTER · ARROW KEYS</span>
                    <span id="sceneCounter">1 / 1</span>
                </div>
            </section>
        </section>

        <section class="chapter-complete hidden" id="chapterComplete" aria-labelledby="chapterCompleteTitle">
            <div class="completion-mark" aria-hidden="true">✦</div>

            <p class="eyebrow"><bdi data-meta="endLabelEyebrow"></bdi></p>

            <h1 id="chapterCompleteTitle" data-meta="endTitle"></h1>

            <p class="subtitle" data-meta="endText"></p>

            <a class="primary-button button-link" id="endLink" href="../chapters.html"> <bdi data-meta="endLabel"></bdi> <span
                    aria-hidden="true">→</span></a>
        </section>

    </main>
</body>

</html>
