<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09070f">
    <title>Memory Shelf - What Screen Again?</title>
    <link rel="stylesheet" href="css/memory-log.css">
    <script src="js/progress.js" defer></script>
    <script src="js/acts.js" defer></script>
    <script src="js/memory-log.js" defer></script>
</head>

<body>
    <main class="memory-app">
        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>

        <section class="shelf-screen" id="shelfScreen">
            <a class="shelf-back" href="index.html" aria-label="Return to title screen">
                <span aria-hidden="true">↖</span>
                <span>TITLE SCREEN</span>
            </a>

            <div class="page-title">
                <p class="eyebrow">WHAT SCREEN AGAIN? · PERSONAL ARCHIVE</p>
                <h1>Memory Shelf</h1>
                <p class="subtitle">Every chapter leaves something behind.</p>
            </div>

            <section class="shelf-scene" aria-label="Seven chapter books">
                <div class="shelf-aura" aria-hidden="true"></div>

                <div class="book-row" id="bookRow"></div>

                <div class="shelf-board" aria-hidden="true">
                    <div class="shelf-edge"></div>
                    <div class="shelf-front"></div>
                </div>
            </section>

            <div class="shelf-caption">
                <span class="caption-mark" aria-hidden="true"></span>
                <p id="shelfMessage" aria-live="polite">Some memories have yet to be written.</p>
                <span class="caption-mark" aria-hidden="true"></span>
            </div>

            <div class="shelf-progress" aria-label="Chapter completion">
                <span id="progressLabel">0 / 7 MEMORIES</span>
                <span class="progress-track" aria-hidden="true">
                    <span id="progressFill"></span>
                </span>
            </div>
        </section>

        <section class="book-reader" id="bookReader" aria-hidden="true" aria-label="Chapter memory archive">
            <div class="reader-backdrop" id="readerBackdrop"></div>

            <article class="reader-book" id="readerBook" aria-labelledby="readerTitle">
                <div class="reader-topline">
                    <div>
                        <p class="reader-eyebrow" id="readerAct">MEMORY FRAGMENT · ACT I</p>
                        <h2 id="readerTitle">A World Behind Glass</h2>
                        <p class="reader-subtitle" id="readerSubtitle">The moments that remain.</p>
                    </div>

                    <button class="close-reader" id="closeReader" type="button"
                        aria-label="Close memory archive">×</button>
                </div>

                <div class="reader-rule" aria-hidden="true"></div>
                <div class="reader-content" id="readerContent" tabindex="0" aria-live="polite"></div>

                <footer class="reader-bottom">
                    <span id="readerEntryCount">0 ENTRIES</span>
                    <span>END OF ARCHIVE</span>
                </footer>
            </article>
        </section>
    </main>
</body>

</html>
