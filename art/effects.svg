      <stop offset=".5" stop-color="#c8aaff" stop-opacity="0" />
      <stop offset="1" stop-color="#9b68ff" stop-opacity=".1" />
    </linearGradient>
    <pattern id="scanlines" width="4" height="5" patternUnits="userSpaceOnUse">
