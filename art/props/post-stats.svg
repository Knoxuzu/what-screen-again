    <linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4a8ff" stop-opacity=".2" />
      <stop offset="1" stop-color="#c4a8ff" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
