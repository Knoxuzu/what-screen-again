<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1733" />
      <stop offset="1" stop-color="#100b20" />
    </linearGradient>

    <linearGradient id="photoBg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffcb91" />
      <stop offset=".52" stop-color="#c17d91" />
      <stop offset="1" stop-color="#59365f" />
