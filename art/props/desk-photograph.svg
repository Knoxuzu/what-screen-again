        <linearGradient id="lt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd08a" stop-opacity="0.85" />
            <stop offset="1" stop-color="#ff9a6a" stop-opacity="0.55" />
        </linearGradient>

        <filter id="sb" x="-50%" y="-50%" width="200%" height="200%">
