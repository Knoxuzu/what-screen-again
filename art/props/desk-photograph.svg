<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440">
    <defs>
        <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1b1531" />
            <stop offset="1" stop-color="#0f0b20" />
        </linearGradient>

        <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5" />
        </filter>

        <linearGradient id="wl" x1="0" y1="0" x2="0.8" y2="1">
            <stop offset="0" stop-color="#f8b57c" />
            <stop offset="0.5" stop-color="#cc6a82" />
            <stop offset="1" stop-color="#4a2a5e" />
        </linearGradient>

        <linearGradient id="dk" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7b4254" />
            <stop offset="1" stop-color="#2a1a36" />
