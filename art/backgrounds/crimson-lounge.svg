<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img"
  aria-label="Crimson gothic lounge with glowing signage, velvet seating, candlelight, and a ring display">
  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#38101f" />
      <stop offset=".48" stop-color="#210814" />
      <stop offset="1" stop-color="#10040c" />
    </linearGradient>

    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#260b19" />
      <stop offset=".4" stop-color="#100610" />
      <stop offset="1" stop-color="#050309" />
    </linearGradient>

    <linearGradient id="velvet" x2="0" y2="1">
      <stop stop-color="#a3294c" />
      <stop offset=".28" stop-color="#75152f" />
      <stop offset="1" stop-color="#310817" />
    </linearGradient>

    <linearGradient id="seatTop" x2="0" y2="1">
      <stop stop-color="#57132b" />
      <stop offset="1" stop-color="#250714" />
    </linearGradient>

    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb1ca" stop-opacity=".18" />
      <stop offset=".4" stop-color="#8d3151" stop-opacity=".04" />
      <stop offset=".72" stop-color="#ff8ab2" stop-opacity=".1" />
      <stop offset="1" stop-color="#180612" stop-opacity=".2" />
    </linearGradient>

    <linearGradient id="beam" x2="0" y2="1">
      <stop stop-color="#ff648f" stop-opacity=".23" />
      <stop offset="1" stop-color="#ff648f" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glassReflection" x2="1" y2="1">
      <stop stop-color="#ffd5e2" stop-opacity=".22" />
      <stop offset=".5" stop-color="#ff8fb4" stop-opacity=".02" />
      <stop offset="1" stop-color="#ffb6cf" stop-opacity=".12" />
    </linearGradient>

    <radialGradient id="pinkGlow">
      <stop stop-color="#ff356f" stop-opacity=".36" />
      <stop offset=".5" stop-color="#d51b55" stop-opacity=".14" />
      <stop offset="1" stop-color="#ff356f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="warmGlow">
      <stop stop-color="#ffb76b" stop-opacity=".32" />
      <stop offset="1" stop-color="#ff9b57" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette">
      <stop offset=".4" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#030208" stop-opacity=".66" />
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="4" />
    </filter>

    <filter id="signGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <pattern id="wallTexture" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 0H90 M0 0V90" fill="none" stroke="#ff9bb9" stroke-opacity=".025" />
      <circle cx="24" cy="32" r="1" fill="#ffc4d5" opacity=".08" />
      <circle cx="70" cy="72" r="1" fill="#ffc4d5" opacity=".05" />
    </pattern>

    <pattern id="floorTexture" width="160" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 69H160 M80 0V69" fill="none" stroke="#ff8bb0" stroke-opacity=".045" />
    </pattern>
